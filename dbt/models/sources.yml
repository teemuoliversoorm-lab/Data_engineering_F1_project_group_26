version: 2
sources:
  - name: bronze
    schema: bronze
    description: "Validated OpenF1 source snapshots and explicit compatibility records. Airflow owns ingestion."
    tables:
      - name: laps
        description: "One driver/lap/session/event, with original fields in source_record JSONB."
      - name: session_results
        description: "One driver/session/event; Q and R remain separate."
      - name: load_audit
        description: "Current source checksum, count and provenance for each dataset/session batch."
      - name: source_responses
        description: "Original OpenF1 response arrays, request URLs and SHA-256 hashes."
