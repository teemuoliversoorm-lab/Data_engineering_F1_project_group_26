x-airflow: &airflow
  image: ${COMPOSE_PROJECT_NAME:-data_engineering_f1_project_group_26}-airflow:latest
  pull_policy: never
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Copy .env.example to .env}@airflow-db/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PGHOST: warehouse
    PGPORT: "5432"
    PGDATABASE: ${POSTGRES_DB:-f1_warehouse}
    PGUSER: ${POSTGRES_USER:-f1}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    F1_DATA_DIR: /opt/airflow/data
    F1_CACHE_DIR: /opt/airflow/cache
    PYTHONPATH: /opt/airflow/project
  volumes:
    - landing:/opt/airflow/data
    # Retained volume name for existing installs; now OpenF1 request-throttle state.
    - fastf1-cache:/opt/airflow/cache
    - airflow-logs:/opt/airflow/logs
  depends_on:
    warehouse:
      condition: service_healthy
    airflow-db:
      condition: service_healthy

services:
  warehouse:
    build:
      context: .
      dockerfile: docker/warehouse.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-f1_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-f1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    user: "0:0"
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        airflow db migrate
        python -m ingestion.cli init-db
        if ! airflow users list --output json | python -c 'import json,os,sys; sys.exit(0 if any(u["username"] == os.environ["AIRFLOW_ADMIN_USER"] for u in json.load(sys.stdin)) else 1)'; then
          airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname F1 --lastname Admin --role Admin --email admin@example.local
        fi
        # The Airflow CLI can create scheduler log directories as root during init.
        chown -R "$${AIRFLOW_UID}:0" /opt/airflow/data /opt/airflow/cache /opt/airflow/logs

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 30s
      timeout: 10s
      retries: 5

  pipeline:
    <<: *airflow
    profiles: [tools]
    entrypoint: python
    command: ["-m", ingestion.cli, "--help"]

  dbt:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    environment:
      PGHOST: warehouse
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-f1_warehouse}
      PGUSER: ${POSTGRES_USER:-f1}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DBT_PROFILES_DIR: /project/dbt
      DBT_TARGET_PATH: /tmp/dbt-target
      DBT_LOG_PATH: /tmp/dbt-logs
    depends_on:
      warehouse:
        condition: service_healthy
    command: [build]

volumes:
  warehouse-data:
  airflow-db-data:
  landing:
  fastf1-cache:
  airflow-logs:
